name: Shadow worker

# Read-only League A ticks: each run scans only when the trigger policy fires
# or the last scan is over six hours old. Nothing is texted or written to ESPN.
on:
  schedule:
    # Game windows in UTC (EST): every 15 minutes.
    - cron: "*/15 16-23 * * 0,4,6"   # Sunday, Thursday, Saturday afternoon/evening
    - cron: "*/15 0-6 * * 0,1,2,5"   # the night after Saturday, Sunday, Monday, Thursday
    - cron: "*/15 23 * * 1"          # Monday night pre-lock
    # Otherwise every 20 minutes, so every 30-minute trigger window
    # (pre-waiver, pre-lock) gets a tick: waivers, daily drops, the refresh.
    - cron: "4,24,44 * * * *"
    # Daily raw-archive retention.
    - cron: "37 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only; scan nothing and write nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shadow-worker
  cancel-in-progress: false

env:
  ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
  ESPN_S2: ${{ secrets.ESPN_S2 }}
  ESPN_SWID: ${{ secrets.ESPN_SWID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL_RUNTIME }}
  WORKER_USER_ID: ${{ secrets.WORKER_USER_ID }}
  WORKER_TEAM_ID: ${{ secrets.WORKER_TEAM_ID }}
  RAW_ARCHIVE_URL: db:///raw
  DELIVERY_ENABLED: "false"
  SMS_ENABLED: "false"
  ESPN_ACTIONS_ENABLED: "false"

jobs:
  tick:
    if: github.repository == 'Conmcgr/espn-ff-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Until the repository secrets are set, skip cleanly instead of failing
      # (and emailing) on every scheduled run. Logs secret names only.
      - name: Check configuration
        id: config
        run: |
          missing=""
          for pair in ESPN_LEAGUE_ID:ESPN_LEAGUE_ID ESPN_S2:ESPN_S2 ESPN_SWID:ESPN_SWID \
                      DATABASE_URL:DATABASE_URL_RUNTIME WORKER_USER_ID:WORKER_USER_ID \
                      WORKER_TEAM_ID:WORKER_TEAM_ID; do
            var="${pair%%:*}"
            [ -n "${!var}" ] || missing="$missing ${pair#*:}"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Shadow worker skipped; repository secrets not set:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.configured == 'true'
        with:
          enable-cache: true
      - if: steps.config.outputs.configured == 'true'
        run: uv sync --locked --no-dev
      # Health runs before the tick (a scheduling gap is only visible before
      # the next heartbeat) and after it (stale scans, failure streaks).
      # Neither a failed check nor a failed tick stops the steps after it;
      # the last step fails the run if either check found a problem.
      - name: Health before tick
        if: steps.config.outputs.configured == 'true'
        id: health_before
        continue-on-error: true
        env:
          HEALTH_MISSED_MINUTES: "120"
        run: uv run --no-sync python scripts/health_check.py
      - name: Tick
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: uv run --no-sync python scripts/scheduled_tick.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Health after tick
        if: steps.config.outputs.configured == 'true'
        id: health_after
        continue-on-error: true
        env:
          HEALTH_MISSED_MINUTES: "120"
        run: uv run --no-sync python scripts/health_check.py
      - name: Prune raw archive
        if: steps.config.outputs.configured == 'true' && github.event.schedule == '37 10 * * *'
        run: >-
          uv run --no-sync python scripts/prune_archive.py --archive-url "$RAW_ARCHIVE_URL"
          --league-id "$ESPN_LEAGUE_ID" --keep-days 7 --keep-latest 10
      - name: Fail if unhealthy
        if: steps.health_before.outcome == 'failure' || steps.health_after.outcome == 'failure'
        run: exit 1
